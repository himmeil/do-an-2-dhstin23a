# This file was auto-generated by the Firebase CLI
# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - name: Configure app
        id: app_config
        env:
          APP_CONFIG: ${{ secrets.DULIEUCANHAN_ENV }}
        run: |
          if [ -z "$APP_CONFIG" ]; then
            echo "Missing DULIEUCANHAN_ENV repository secret"
            exit 1
          fi
          mkdir -p ca_nhan
          printf '%s' "$APP_CONFIG" > ca_nhan/dulieucanhan.env
          node scripts/validate_dulieucanhan_env.mjs
          project_id=$(jq -r '.FIREBASE_PROJECT_ID // empty' ca_nhan/dulieucanhan.env)
          if [ -z "$project_id" ]; then
            echo "DULIEUCANHAN_ENV must define FIREBASE_PROJECT_ID"
            exit 1
          fi
          echo "project_id=$project_id" >> "$GITHUB_OUTPUT"
      - run: flutter pub get && flutter test && flutter build web --dart-define-from-file=ca_nhan/dulieucanhan.env --dart-define=APP_MODE=firebase
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: ${{ steps.app_config.outputs.project_id }}
